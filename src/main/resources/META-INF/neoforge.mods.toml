modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mixins]]
config="fuziutils.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
FuziUtils — freecam (C) and gamma vision (G) utility mod for NeoForge 1.21.1.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
